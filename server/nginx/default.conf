# Adiciona configuração de log em JSON
log_format json_logs escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"client_ip":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"upstream_response_time":"$upstream_response_time",'
  '"request_time":"$request_time"'
'}';

access_log /var/log/nginx/access.log json_logs;

# Define rate limit por IP
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=5r/s;

# Define cache para respostas do backend
proxy_cache_path /var/cache/nginx 
                 levels=1:2 
                 keys_zone=api_cache:10m 
                 max_size=100m 
                 inactive=10m 
                 use_temp_path=off;

server {
    listen 80;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Limita tamanho do payload
    client_max_body_size 1m;

    # GZIP
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json text/plain;

    location / {
        # Faz upgrade do websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Aplica rate limit
        limit_req zone=ip_limit burst=10 nodelay;
        limit_req_status 429;

        # Aplica cache para respostas do backend
        proxy_cache api_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 404 10s;

        # Proxy para o backend
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
    }

    # Paginas de erro customizadas
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /etc/nginx/errors;
        internal;
    }

    location = /50x.html {
        root /etc/nginx/errors;
        internal;
    }

    # Protege a rota do Swagger UI com autenticação básica
    location /q/swagger-ui {
        auth_basic "Swagger Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

