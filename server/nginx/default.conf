log_format json_logs escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"client_ip":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"upstream_response_time":"$upstream_response_time",'
  '"request_time":"$request_time"'
'}';

access_log /var/log/nginx/access.log json_logs;

# Define zona de limite por IP
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=5r/s;

server {
    listen 80;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Limita tamanho do payload
    client_max_body_size 1m;

    # GZIP
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json text/plain;

    location / {
        # Faz upgrade do websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Aplica rate limit
        limit_req zone=ip_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}